# 9 アプリの依存をまとめて更新する。
#
# npm workspaces なので lockfile はルートに 1 つしかない。アプリごとに
# directory を分けると同じ lockfile を取り合って競合するため、"/" 一本にする。
# 1 つの PR に複数アプリぶんの更新が混ざるが、CI が変更のあったアプリを
# すべて回すので検証はされる。
version: 2
updates:
  # npm (package.json) の依存更新
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
    ignore:
      # eslint 10 は eslint-plugin-react / eslint-plugin-import が未対応で
      # lint 実行時にクラッシュするため、メジャー更新を一時的に見送る。
      # 上流が ESLint 10 に対応したらこの ignore を削除すること。
      - dependency-name: "eslint"
        update-types:
          - version-update:semver-major
      # react は 9 アプリで同じ版に揃えている。ばらけるとアプリごとに
      # コピーがネストし、Next 15 系が /404 のプリレンダーで落ちる。
      # 上げるときは 9 アプリまとめて手で上げる。
      - dependency-name: "react"
      - dependency-name: "react-dom"
    groups:
      # minor / patch はまとめて 1 PR に（major は個別 PR）
      npm-minor-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions の更新
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
    groups:
      github-actions:
        update-types:
          - minor
          - patch
