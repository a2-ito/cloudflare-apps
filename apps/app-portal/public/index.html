<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>a2ito apps</title>
    <meta name="description" content="ブラウザで遊べる小さなアプリ集" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>a2ito apps</h1>
        <p>ブラウザですぐ遊べる小さなアプリ集。ログインは要りません。</p>
      </header>

      <ul class="apps">
        <li>
          <a href="/klondike">
            <span class="name">Klondike</span>
            <span class="desc">定番のソリティア。カードをドラッグして並べる</span>
          </a>
        </li>
        <li>
          <a href="/tetris">
            <span class="name">Tetris</span>
            <span class="desc">落ちてくるブロックを揃えて消す</span>
          </a>
        </li>
        <li>
          <a href="/english-vocabulary-quiz">
            <span class="name">English Vocabulary Quiz</span>
            <span class="desc">英文の意味に合う英単語を 4 択で答える。1 回 10 問</span>
          </a>
        </li>
        <li>
          <a href="/ball-bounce">
            <span class="name">BounceLab</span>
            <span class="desc">摩擦や重力を変えながらボールを跳ねさせる物理シミュレーション</span>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
